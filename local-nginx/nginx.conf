# Benchmark config for the nginx-wasm cell (ngx_wasm_module + Wasmtime).
#
# Single worker for clean CPU%% attribution in resource monitoring; bump to
# `auto` for throughput-oriented runs. Access log off so disk writes don't
# contaminate latency numbers.

worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

wasm {
    module consent_filter /wasm/consent_filter.wasm;
}

http {
    access_log off;

    # The shared origin echo server on the host (network_mode: host).
    upstream host_origin {
        server 127.0.0.1:3131;
        keepalive 32;
    }

    server {
        listen 3132 reuseport;

        # Health check bypasses the filter entirely (orchestrator preflight).
        location = /healthz {
            return 200 "ok\n";
        }

        location / {
            proxy_wasm consent_filter;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://host_origin;
        }
    }
}
